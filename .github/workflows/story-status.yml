name: Story status
on:
  push:
    branches: ['story/**']

permissions:
  contents: read

env:
  OWNER: leojiang
  PROJECT_TITLE: SDLC Pilot
  STATUS_FIELD: Status
  TARGET_STATUS: In progress

jobs:
  set-in-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Move story item to In progress
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "⚠️ PROJECT_TOKEN secret not set — board status not updated (see story #5)"; exit 0
          fi
          NUM="${GITHUB_REF_NAME#story/}"; NUM="${NUM%%-*}"
          if ! [[ "$NUM" =~ ^[0-9]+$ ]]; then
            echo "Branch '$GITHUB_REF_NAME' has no leading issue number — skipping"; exit 0
          fi
          # Resolve project, Status field, target option, and the issue's board item
          META=$(gh api graphql -f query='
            query($login: String!) {
              user(login: $login) {
                projectV2(first: 20) {
                  nodes {
                    id title
                    fields(first: 30) { nodes { ... on ProjectV2SingleSelectField { name id options { id name } } } }
                    items(first: 100) { nodes { id content { ... on Issue { number } } } }
                  }
                }
              }
            }' -f login="$OWNER")
          PROJ=$(jq -r --arg t "$PROJECT_TITLE" '.data.user.projectV2.nodes[] | select(.title == $t) | .id' <<<"$META")
          FIELD=$(jq -r --arg t "$PROJECT_TITLE" --arg f "$STATUS_FIELD" '.data.user.projectV2.nodes[] | select(.title == $t) | .fields.nodes[]? | select(.name == $f) | .id' <<<"$META")
          OPTION=$(jq -r --arg t "$PROJECT_TITLE" --arg f "$STATUS_FIELD" --arg o "$TARGET_STATUS" '.data.user.projectV2.nodes[] | select(.title == $t) | .fields.nodes[]? | select(.name == $f) | .options[]? | select(.name == $o) | .id' <<<"$META")
          if [ -z "$PROJ" ] || [ "$PROJ" = "null" ] || [ -z "$FIELD" ] || [ "$FIELD" = "null" ] || [ -z "$OPTION" ] || [ "$OPTION" = "null" ]; then
            echo "::error::project/field/option not found (title='$PROJECT_TITLE' field='$STATUS_FIELD' status='$TARGET_STATUS')"; exit 1
          fi
          ITEM=$(jq -r --arg t "$PROJECT_TITLE" --argjson n "$NUM" '.data.user.projectV2.nodes[] | select(.title == $t) | .items.nodes[]? | select((.content.number? // -1) == $n) | .id' <<<"$META")
          if [ -z "$ITEM" ] || [ "$ITEM" = "null" ]; then
            CONTENT=$(gh issue view "$NUM" -R "$GITHUB_REPOSITORY" --json id -q .id)
            ITEM=$(gh api graphql -f query='mutation($p: ID!, $c: ID!){ addProjectV2ItemById(input:{projectId:$p contentId:$c}){ item{ id } } }' -f p="$PROJ" -f c="$CONTENT" | jq -r '.data.addProjectV2ItemById.item.id')
          fi
          gh api graphql -f query='mutation($p: ID!, $i: ID!, $f: ID!, $o: String!){ updateProjectV2ItemFieldValue(input:{projectId:$p itemId:$i fieldId:$f value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' -f p="$PROJ" -f i="$ITEM" -f f="$FIELD" -f o="$OPTION" > /dev/null
          echo "✅ Story issue #$NUM → $TARGET_STATUS"
