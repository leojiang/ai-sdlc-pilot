name: Board add
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

# Story creation fires opened + labeled events concurrently (story-draft adds two
# labels at once); serialize per-issue so the membership check can't race itself.
concurrency:
  group: board-add-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  PROJECT_TITLE: SDLC Pilot
  STATUS_FIELD: Status
  INITIAL_STATUS: Backlog

jobs:
  add-story-to-backlog:
    # Only OPEN story issues belong on the board; label applied on creation or
    # later — closed stories are terminal and never (re-)added
    if: contains(github.event.issue.labels.*.name, 'story') && github.event.issue.state == 'OPEN'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add story issue to board at Backlog
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "⚠️ PROJECT_TOKEN secret not set — issue #$ISSUE_NUMBER not added to board"; exit 0
          fi
          gql() {
            local out
            if ! out=$(gh api graphql "$@"); then
              echo "::error::gh api graphql failed"; return 1
            fi
            if ! jq -e '(.errors // []) | length == 0' >/dev/null <<<"$out"; then
              echo "::error::GraphQL errors: $(jq -c '.errors' <<<"$out")"; return 1
            fi
            printf '%s' "$out"
          }
          # Org-portable project lookup: organization() ERRORS (not nulls) for user
          # logins, so probe it tolerantly first, then fall back to user()
          META=$(gh api graphql -f query='
            query($login: String!) {
              organization(login: $login) {
                projectsV2(first: 20) { nodes { id title fields(first: 30) { nodes { ... on ProjectV2SingleSelectField { name id options { id name } } } } } }
              }
            }' -f login="$OWNER" 2>/dev/null || true)
          if ! jq -e --arg t "$PROJECT_TITLE" '[(.data.organization.projectsV2.nodes[]?) | select(.title == $t)] | length > 0' <<<"${META:-null}" >/dev/null 2>&1; then
            META=$(gql -f query='
              query($login: String!) {
                user(login: $login) {
                  projectsV2(first: 20) { nodes { id title fields(first: 30) { nodes { ... on ProjectV2SingleSelectField { name id options { id name } } } } } }
                }
              }' -f login="$OWNER")
          fi
          PNODE=$(jq -c --arg t "$PROJECT_TITLE" '[(.data.organization.projectsV2.nodes[]?), (.data.user.projectsV2.nodes[]?)] | map(select(.title == $t)) | .[0] // empty' <<<"$META")
          if [ -z "$PNODE" ]; then
            echo "::error::project '$PROJECT_TITLE' not found for $OWNER"; exit 1
          fi
          PROJ=$(jq -r '.id' <<<"$PNODE")
          FIELD=$(jq -r --arg f "$STATUS_FIELD" '.fields.nodes[]? | select(.name == $f) | .id' <<<"$PNODE")
          OPTION=$(jq -r --arg f "$STATUS_FIELD" --arg o "$INITIAL_STATUS" '.fields.nodes[]? | select(.name == $f) | .options[]? | select(.name == $o) | .id' <<<"$PNODE")
          if [ -z "$FIELD" ] || [ "$FIELD" = "null" ] || [ -z "$OPTION" ] || [ "$OPTION" = "null" ]; then
            echo "::error::field '$STATUS_FIELD' or option '$INITIAL_STATUS' not found"; exit 1
          fi
          # Idempotency: walk ALL pages of board items (single query, nullable cursor)
          # — never re-add (and never reset Status on) an issue that's already there.
          # Membership is matched by issue number AND repository.
          ON_BOARD=""
          CURSOR=""
          while :; do
            PAGE=$(gql -f query='
              query($id: ID!, $c: String) {
                node(id: $id) {
                  ... on ProjectV2 {
                    items(first: 100, after: $c) {
                      pageInfo { hasNextPage endCursor }
                      nodes { content { ... on Issue { number repository { nameWithOwner } } } }
                    }
                  }
                }
              }' -f id="$PROJ" -F c="${CURSOR:-null}")
            if jq -e --argjson n "$ISSUE_NUMBER" --arg repo "$GITHUB_REPOSITORY" '.data.node.items.nodes[]? | select((.content.number? // -1) == $n and (.content.repository.nameWithOwner? // "") == $repo)' <<<"$PAGE" > /dev/null; then
              ON_BOARD=yes; break
            fi
            if [ "$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")" != "true" ]; then break; fi
            CURSOR=$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")
          done
          if [ "$ON_BOARD" = "yes" ]; then
            echo "issue #$ISSUE_NUMBER already on the board — nothing to do"; exit 0
          fi
          # Node id comes from the event payload — no gh issue view call, no extra scope
          ITEM=$(gql -f query='mutation($p: ID!, $c: ID!){ addProjectV2ItemById(input:{projectId:$p contentId:$c}){ item{ id } } }' -f p="$PROJ" -f c="$ISSUE_NODE_ID" | jq -r '.data.addProjectV2ItemById.item.id')
          gql -f query='mutation($p: ID!, $i: ID!, $f: ID!, $o: String!){ updateProjectV2ItemFieldValue(input:{projectId:$p itemId:$i fieldId:$f value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' -f p="$PROJ" -f i="$ITEM" -f f="$FIELD" -f o="$OPTION" > /dev/null
          echo "✅ Issue #$ISSUE_NUMBER added to '$PROJECT_TITLE' at $INITIAL_STATUS"
