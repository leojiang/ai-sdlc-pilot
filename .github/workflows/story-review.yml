name: Story review
on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited]

permissions:
  contents: read

env:
  PROJECT_TITLE: SDLC Pilot
  STATUS_FIELD: Status
  TARGET_STATUS: In review

jobs:
  set-in-review:
    # Only non-draft, same-repo PRs; for edited PRs, only when the body changed
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Move story items closed by this PR to In review
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "⚠️ PROJECT_TOKEN secret not set — no In-review moves for PR #$PR_NUMBER"; exit 0
          fi
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          gql() {
            local out
            if ! out=$(gh api graphql "$@"); then
              echo "::error::gh api graphql failed"; return 1
            fi
            if ! jq -e '(.errors // []) | length == 0' >/dev/null <<<"$out"; then
              echo "::error::GraphQL errors: $(jq -c '.errors' <<<"$out")"; return 1
            fi
            printf '%s' "$out"
          }
          # Closing references only — resolved by GitHub from closing keywords, so:
          # no body text parsing (nothing to crash on empty bodies), no mere-mention
          # moves. Repo scoping is enforced below (cross-repo closing refs exist).
          RES=$(gql -F n="$PR_NUMBER" -f query='
            query($o: String!, $r: String!, $n: Int!) {
              repository(owner: $o, name: $r) {
                pullRequest(number: $n) {
                  closingIssuesReferences(first: 20) {
                    nodes {
                      number state id
                      repository { nameWithOwner }
                      labels(first: 50) { nodes { name } }
                      projectItems(first: 50) { nodes { id project { title } } }
                    }
                  }
                }
              }
            }' -f o="$OWNER" -f r="$REPO_NAME")
          COUNT=$(jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes | length' <<<"$RES")
          if [ -z "$COUNT" ] || [ "$COUNT" = "null" ] || [ "$COUNT" = "0" ]; then
            echo "PR #$PR_NUMBER closes no issues — skipping"; exit 0
          fi
          # Org-portable project lookup: organization() ERRORS (not nulls) for user
          # logins, so probe it tolerantly first, then fall back to user()
          META=$(gh api graphql -f query='
            query($login: String!) {
              organization(login: $login) {
                projectsV2(first: 20) { nodes { id title fields(first: 30) { nodes { ... on ProjectV2SingleSelectField { name id options { id name } } } } } }
              }
            }' -f login="$OWNER" 2>/dev/null || true)
          if ! jq -e --arg t "$PROJECT_TITLE" '[(.data.organization.projectsV2.nodes[]?) | select(.title == $t)] | length > 0' <<<"${META:-null}" >/dev/null 2>&1; then
            META=$(gql -f query='
              query($login: String!) {
                user(login: $login) {
                  projectsV2(first: 20) { nodes { id title fields(first: 30) { nodes { ... on ProjectV2SingleSelectField { name id options { id name } } } } } }
                }
              }' -f login="$OWNER")
          fi
          PNODE=$(jq -c --arg t "$PROJECT_TITLE" '[(.data.organization.projectsV2.nodes[]?), (.data.user.projectsV2.nodes[]?)] | map(select(.title == $t)) | .[0] // empty' <<<"$META")
          if [ -z "$PNODE" ]; then
            echo "::error::project '$PROJECT_TITLE' not found for $OWNER"; exit 1
          fi
          PROJ=$(jq -r '.id' <<<"$PNODE")
          FIELD=$(jq -r --arg f "$STATUS_FIELD" '.fields.nodes[]? | select(.name == $f) | .id' <<<"$PNODE")
          OPTION=$(jq -r --arg f "$STATUS_FIELD" --arg o "$TARGET_STATUS" '.fields.nodes[]? | select(.name == $f) | .options[]? | select(.name == $o) | .id' <<<"$PNODE")
          if [ -z "$FIELD" ] || [ "$FIELD" = "null" ] || [ -z "$OPTION" ] || [ "$OPTION" = "null" ]; then
            echo "::error::field '$STATUS_FIELD' or option '$TARGET_STATUS' not found"; exit 1
          fi
          MOVED=0
          # Only OPEN, story-labeled issues FROM THIS REPO: cross-repo closing refs,
          # non-story issues, and closed issues never touch this board.
          while IFS= read -r ISSUE; do
            NUM=$(jq -r '.number' <<<"$ISSUE")
            ITEM=$(jq -r --arg t "$PROJECT_TITLE" '.projectItems.nodes[]? | select(.project.title == $t) | .id' <<<"$ISSUE")
            if [ -z "$ITEM" ] || [ "$ITEM" = "null" ]; then
              CONTENT=$(jq -r '.id' <<<"$ISSUE")
              ITEM=$(gql -f query='mutation($p: ID!, $c: ID!){ addProjectV2ItemById(input:{projectId:$p contentId:$c}){ item{ id } } }' -f p="$PROJ" -f c="$CONTENT" | jq -r '.data.addProjectV2ItemById.item.id')
            fi
            gql -f query='mutation($p: ID!, $i: ID!, $f: ID!, $o: String!){ updateProjectV2ItemFieldValue(input:{projectId:$p itemId:$i fieldId:$f value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' -f p="$PROJ" -f i="$ITEM" -f f="$FIELD" -f o="$OPTION" > /dev/null
            echo "✅ issue #$NUM → $TARGET_STATUS (PR #$PR_NUMBER)"
            MOVED=1
          done < <(jq -c --arg repo "$GITHUB_REPOSITORY" '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                          | select(.state == "OPEN")
                          | select(.repository.nameWithOwner == $repo)
                          | select(any(.labels.nodes[].name; . == "story"))' <<<"$RES")
          if [ "$MOVED" != "1" ]; then echo "no open story issues from this repo closed by this PR — board unchanged"; fi
