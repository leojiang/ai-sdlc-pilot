name: Story review
on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited]

permissions:
  contents: read

env:
  PROJECT_TITLE: SDLC Pilot
  STATUS_FIELD: Status
  TARGET_STATUS: In review

jobs:
  set-in-review:
    # Only non-draft, same-repo PRs; for edited PRs, only when the body changed
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Move story items closed by this PR to In review
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "⚠️ PROJECT_TOKEN secret not set — no In-review moves for PR #$PR_NUMBER"; exit 0
          fi
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # Closing references only — resolved by GitHub from closing keywords, so:
          # no body text parsing (nothing to crash on empty bodies), no cross-repo
          # full-form refs misread as local numbers, no mere-mention moves.
          RES=$(gh api graphql -f query='
            query($o: String!, $r: String!, $n: Int!) {
              repository(owner: $o, name: $r) {
                pullRequest(number: $n) {
                  closingIssuesReferences(first: 20) {
                    nodes {
                      number state id
                      labels(first: 50) { nodes { name } }
                      projectItems(first: 50) { nodes { id project { title } } }
                    }
                  }
                }
              }
            }' -f o="$OWNER" -f r="$REPO_NAME" -f n="$PR_NUMBER")
          COUNT=$(jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes | length' <<<"$RES")
          if [ -z "$COUNT" ] || [ "$COUNT" = "null" ] || [ "$COUNT" = "0" ]; then
            echo "PR #$PR_NUMBER closes no issues — skipping"; exit 0
          fi
          # Resolve project, Status field, and target option once
          META=$(gh api graphql -f query='
            query($login: String!) {
              user(login: $login) {
                projectsV2(first: 20) {
                  nodes {
                    id title
                    fields(first: 30) { nodes { ... on ProjectV2SingleSelectField { name id options { id name } } } }
                  }
                }
              }
            }' -f login="$OWNER")
          PROJ=$(jq -r --arg t "$PROJECT_TITLE" '.data.user.projectsV2.nodes[] | select(.title == $t) | .id' <<<"$META")
          FIELD=$(jq -r --arg t "$PROJECT_TITLE" --arg f "$STATUS_FIELD" '.data.user.projectsV2.nodes[] | select(.title == $t) | .fields.nodes[]? | select(.name == $f) | .id' <<<"$META")
          OPTION=$(jq -r --arg t "$PROJECT_TITLE" --arg f "$STATUS_FIELD" --arg o "$TARGET_STATUS" '.data.user.projectsV2.nodes[] | select(.title == $t) | .fields.nodes[]? | select(.name == $f) | .options[]? | select(.name == $o) | .id' <<<"$META")
          if [ -z "$PROJ" ] || [ "$PROJ" = "null" ] || [ -z "$FIELD" ] || [ "$FIELD" = "null" ] || [ -z "$OPTION" ] || [ "$OPTION" = "null" ]; then
            echo "::error::project/field/option not found (title='$PROJECT_TITLE' field='$STATUS_FIELD' status='$TARGET_STATUS')"; exit 1
          fi
          MOVED=0
          # Only OPEN issues carrying the story label: non-story issues never
          # touch this board, closed references never move
          while IFS= read -r ISSUE; do
            NUM=$(jq -r '.number' <<<"$ISSUE")
            ITEM=$(jq -r --arg t "$PROJECT_TITLE" '.projectItems.nodes[]? | select(.project.title == $t) | .id' <<<"$ISSUE")
            if [ -z "$ITEM" ] || [ "$ITEM" = "null" ]; then
              CONTENT=$(jq -r '.id' <<<"$ISSUE")
              ITEM=$(gh api graphql -f query='mutation($p: ID!, $c: ID!){ addProjectV2ItemById(input:{projectId:$p contentId:$c}){ item{ id } } }' -f p="$PROJ" -f c="$CONTENT" | jq -r '.data.addProjectV2ItemById.item.id')
            fi
            gh api graphql -f query='mutation($p: ID!, $i: ID!, $f: ID!, $o: String!){ updateProjectV2ItemFieldValue(input:{projectId:$p itemId:$i fieldId:$f value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' -f p="$PROJ" -f i="$ITEM" -f f="$FIELD" -f o="$OPTION" > /dev/null
            echo "✅ issue #$NUM → $TARGET_STATUS (PR #$PR_NUMBER)"
            MOVED=1
          done < <(jq -c '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                          | select(.state == "OPEN")
                          | select(any(.labels.nodes[].name; . == "story"))' <<<"$RES")
          if [ "$MOVED" != "1" ]; then echo "no open story issues closed by this PR — board unchanged"; fi
