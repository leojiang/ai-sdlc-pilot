name: AI Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: npm install -g @anthropic-ai/claude-code

      - name: Trust workspace for Claude Code
        env:
          WS: ${{ github.workspace }}
        run: printf '{"projects":{"%s":{"hasTrustDialogAccepted":true}}}' "$WS" > "$HOME/.claude.json"

      - name: Build the review prompt
        run: |
          set -euo pipefail
          if [ -n "${COMMENT_BODY:-}" ]; then
            { echo "A reviewer requested the following on PR #$PR_NUMBER:"; echo; \
              echo "$COMMENT_BODY"; echo; \
              echo "Follow .claude/prompts/pr-review.md, plus this specific request."; } > prompt.txt
          else
            echo "Review pull request #$PR_NUMBER. Read .claude/prompts/pr-review.md and follow it exactly. Inspect the diff and surrounding code with the provided tools. Write the final markdown review to stdout." > prompt.txt
          fi

      - name: Run AI review
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "⚠️ AI review skipped: ANTHROPIC_AUTH_TOKEN secret not set" > review.md
            exit 0
          fi
          claude -p "$(cat prompt.txt)" \
            --allowedTools "Read" "Grep" "Glob" "Bash(gh pr *)" "Bash(gh issue view *)" \
            --max-turns 30 > review.md

      - name: Post review comment
        run: |
          if [ -s review.md ]; then
            gh pr comment "$PR_NUMBER" --body-file review.md
          fi
