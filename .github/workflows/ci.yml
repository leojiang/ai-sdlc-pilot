name: CI
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # The team's canonical pub host is the flutter-io.cn mirror — developer
      # machines resolve against it and the committed frontend/pubspec.lock
      # records its URLs. CI must use the same host, or `flutter pub get`
      # rewrites every lockfile entry and the repo-hygiene check fails.
      # (Flip this + re-resolve the lock against pub.dev if the team standard
      # ever changes.)
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # Flutter is pinned (not the runner image's unpinned copy) so builds are
      # deterministic — story #1 edge case 4.
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.41.9, channel: stable }
      - run: make lint

  test:
    runs-on: ubuntu-latest
    env:
      # The team's canonical pub host is the flutter-io.cn mirror — developer
      # machines resolve against it and the committed frontend/pubspec.lock
      # records its URLs. CI must use the same host, or `flutter pub get`
      # rewrites every lockfile entry and the repo-hygiene check fails.
      # (Flip this + re-resolve the lock against pub.dev if the team standard
      # ever changes.)
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.41.9, channel: stable }
      - run: make bootstrap
      - run: make test-coverage
      - name: Wrapper verify (full lifecycle incl. jar packaging)
        run: cd backend && ./mvnw -q verify
      - name: Repo hygiene — no build artifacts committed or created
        run: |
          set -euo pipefail
          # AC1: nothing under artifact/IDE dirs may be committed.
          BAD=$(git ls-files | grep -E '(^|/)(target|build|\.gradle|\.dart_tool|\.idea|\.vscode)/|\.(iml)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Committed build artifacts found:"; echo "$BAD"; exit 1
          fi
          # N6: a full build must leave the working tree clean (.gitignore completeness).
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::Working tree dirty after build — .gitignore is incomplete:"; echo "$DIRTY"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/target/site/jacoco/
            frontend/coverage/
          if-no-files-found: ignore

  traceability:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: PR must reference a story issue
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR" --json body -q .body)
          echo "$BODY" | grep -qE '#[0-9]+' || {
            echo "::error::PR body must reference a story issue (e.g. 'Closes #1')"; exit 1; }

  triage:
    needs: [test]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Trust workspace for Claude Code
        env:
          WS: ${{ github.workspace }}
        run: printf '{"projects":{"%s":{"hasTrustDialogAccepted":true}}}' "$WS" > "$HOME/.claude.json"
      - name: AI failure triage
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "⚠️ AI triage skipped: ANTHROPIC_AUTH_TOKEN secret not set"; exit 0
          fi
          # Same prompt-injection guard as ai-review.yml: never run the agent on fork content.
          HEAD_OWNER=$(gh pr view "$PR_NUMBER" --json headRepositoryOwner -q .headRepositoryOwner.login)
          if [ "$HEAD_OWNER" != "$OWNER" ]; then
            echo "⚠️ AI triage skipped: PR #$PR_NUMBER originates from fork $HEAD_OWNER"; exit 0
          fi
          gh run view "$RUN_ID" --log-failed > failed-logs.txt || true
          claude -p "CI failed on PR #$PR_NUMBER. Failed-job logs are in failed-logs.txt. Classify the failure: real regression vs flaky test vs environment/config problem. Identify the most likely responsible change and the fix. Output concise markdown: classification, evidence, recommended next action. Write to stdout." \
            --allowedTools "Read" "Grep" "Bash(gh *)" \
            --max-turns 15 > triage.md
          gh pr comment "$PR_NUMBER" --body-file triage.md
