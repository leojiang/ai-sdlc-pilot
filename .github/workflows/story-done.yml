name: Story done
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# Global serialization: per-issue grouping is impossible from PR events, and two
# same-window merges of PRs both closing an unboarded story would double-add its
# card. story-done runs are rare and fast — a single global group closes the race.
concurrency:
  group: story-done-board
  cancel-in-progress: false

env:
  PROJECT_TITLE: SDLC Pilot
  STATUS_FIELD: Status
  TARGET_STATUS: Done

jobs:
  set-done:
    # Only actual merges of same-repo PRs into the default branch — non-default
    # merges don't auto-close the issue, so Done there would be premature terminal
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Deliberate: checkout + lookup run before the script's cheap guards —
      # fail-loud on board misconfiguration beats silent skips (~10s per run).
      - uses: actions/checkout@v4
      - uses: ./.github/actions/project-lookup
        with:
          gh-token: ${{ secrets.PROJECT_TOKEN }}
          owner: ${{ github.repository_owner }}
          project-title: ${{ env.PROJECT_TITLE }}
          status-field: ${{ env.STATUS_FIELD }}
          target-status: ${{ env.TARGET_STATUS }}
      - name: Move story items closed by this PR to Done
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "⚠️ PROJECT_TOKEN secret not set — no Done moves for PR #$PR_NUMBER"; exit 0
          fi
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          gql() {
            local out
            if ! out=$(gh api graphql "$@"); then
              echo "::error::gh api graphql failed"; return 1
            fi
            if ! jq -e '(.errors // []) | length == 0' >/dev/null <<<"$out"; then
              echo "::error::GraphQL errors: $(jq -c '.errors' <<<"$out")"; return 1
            fi
            printf '%s' "$out"
          }
          # Closing references resolved by GitHub — includes follow-up PRs that
          # "Closes #N" an already-closed story (the healing case the built-in
          # handles slowly or not at all)
          RES=$(gql -F n="$PR_NUMBER" -f query='
            query($o: String!, $r: String!, $n: Int!) {
              repository(owner: $o, name: $r) {
                pullRequest(number: $n) {
                  closingIssuesReferences(first: 20) {
                    nodes {
                      number state id
                      repository { nameWithOwner }
                      labels(first: 50) { nodes { name } }
                      projectItems(first: 50) { nodes { id project { title } } }
                    }
                  }
                }
              }
            }' -f o="$OWNER" -f r="$REPO_NAME")
          COUNT=$(jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes | length' <<<"$RES")
          if [ -z "$COUNT" ] || [ "$COUNT" = "null" ] || [ "$COUNT" = "0" ]; then
            echo "PR #$PR_NUMBER closes no issues — skipping"; exit 0
          fi
          # Project/field/option resolved by the shared project-lookup action —
          # branch on its marker so an accidental skip can't dereference unset ids
          if [ "${PROJECT_LOOKUP:-}" != "ok" ]; then
            echo "⚠️ project-lookup did not resolve — skipping"; exit 0
          fi
          PROJ="$PROJ_ID"; FIELD="$FIELD_ID"; OPTION="$OPTION_ID"
          MOVED=0
          # Story-labeled closing refs from THIS repo, in ANY issue state — Done is
          # terminal and idempotent, so this both completes normal merges and heals
          # follow-up merges to already-closed stories
          while IFS= read -r ISSUE; do
            NUM=$(jq -r '.number' <<<"$ISSUE")
            ITEMS=$(jq -r --arg t "$PROJECT_TITLE" '.projectItems.nodes[]? | select(.project.title == $t) | .id' <<<"$ISSUE")
            if [ -z "$ITEMS" ] || [ "$ITEMS" = "null" ]; then
              CONTENT=$(jq -r '.id' <<<"$ISSUE")
              ITEMS=$(gql -f query='mutation($p: ID!, $c: ID!){ addProjectV2ItemById(input:{projectId:$p contentId:$c}){ item{ id } } }' -f p="$PROJ" -f c="$CONTENT" | jq -r '.data.addProjectV2ItemById.item.id')
              echo "⚠️ issue #$NUM was not on the board — added directly at $TARGET_STATUS (no lifecycle trail)"
            fi
            # Update every matching item — a multi-line id fed to one mutation
            # would fail the run that owns the terminal transition
            while IFS= read -r ITEM; do
              [ -n "$ITEM" ] || continue
              gql -f query='mutation($p: ID!, $i: ID!, $f: ID!, $o: String!){ updateProjectV2ItemFieldValue(input:{projectId:$p itemId:$i fieldId:$f value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' -f p="$PROJ" -f i="$ITEM" -f f="$FIELD" -f o="$OPTION" > /dev/null
            done <<<"$ITEMS"
            echo "✅ issue #$NUM → $TARGET_STATUS (PR #$PR_NUMBER merged)"
            MOVED=1
          done < <(jq -c --arg repo "$GITHUB_REPOSITORY" '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                          | select(.repository.nameWithOwner == $repo)
                          | select(any(.labels.nodes[].name; . == "story"))' <<<"$RES")
          if [ "$MOVED" != "1" ]; then echo "no story issues from this repo closed by this PR — board unchanged"; fi
          # Heal sweep (closes the concurrency-group drop window): a superseded
          # pending run can be CANCELLED (grey, not red), leaving its closed
          # issues' cards below Done with no other healer. Every surviving run
          # therefore also repairs: any board item whose issue is CLOSED+COMPLETED
          # from this repo and not yet Done goes to Done. Idempotent and terminal.
          HEAL_CURSOR=""
          while :; do
            if [ -n "$HEAL_CURSOR" ]; then
              HPAGE=$(gql -f query='
                query($id: ID!, $c: String!) {
                  node(id: $id) { ... on ProjectV2 {
                    items(first: 100, after: $c) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        fieldValues(first: 10) { nodes { ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2SingleSelectField { name } } } } }
                        content { ... on Issue { state stateReason repository { nameWithOwner } } }
                      }
                    }
                  } }
                }' -f id="$PROJ" -f c="$HEAL_CURSOR")
            else
              HPAGE=$(gql -f query='
                query($id: ID!) {
                  node(id: $id) { ... on ProjectV2 {
                    items(first: 100) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        fieldValues(first: 10) { nodes { ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2SingleSelectField { name } } } } }
                        content { ... on Issue { state stateReason repository { nameWithOwner } } }
                      }
                    }
                  } }
                }' -f id="$PROJ")
            fi
            while IFS=$'\t' read -r HID _TAG; do
              [ -n "$HID" ] || continue
              gql -f query='mutation($p: ID!, $i: ID!, $f: ID!, $o: String!){ updateProjectV2ItemFieldValue(input:{projectId:$p itemId:$i fieldId:$f value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' -f p="$PROJ" -f i="$HID" -f f="$FIELD" -f o="$OPTION" > /dev/null
              echo "🩹 heal: closed story's card → $TARGET_STATUS (recovered from a superseded/cancelled run)"
            done < <(jq -r --arg repo "$GITHUB_REPOSITORY" '
              .data.node.items.nodes[]?
              | select((.content.state? // "") == "CLOSED")
              | select((.content.stateReason? // "") == "COMPLETED")
              | select((.content.repository.nameWithOwner? // "") == $repo)
              | select(([.fieldValues.nodes[]? | select(.field.name == "Status") | .name] | first) != "Done")
              | "\(.id)\theal"' <<<"$HPAGE")
            if [ "$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$HPAGE")" != "true" ]; then break; fi
            HEAL_CURSOR=$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$HPAGE")
          done
